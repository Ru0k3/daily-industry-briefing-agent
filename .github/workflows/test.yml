name: test-and-validate

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r examples/render-agent/requirements.txt pytest
      - name: Run provider contract checks
        run: python scripts/verify_provider_contracts.py
      - name: Run tests
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=infra/terraform validate
